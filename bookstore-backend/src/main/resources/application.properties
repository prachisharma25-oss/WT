# Server Configuration
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/bookstoredb
spring.data.mongodb.database=bookstoredb

# JWT Configuration
jwt.secret=bookstore_super_secret_key_change_in_production_must_be_at_least_256bits
jwt.expiration=86400000

# Logging
logging.level.com.bookstore=DEBUG
